name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Job lint : rapide (~30s), bloque les PR qui ne respectent pas ruff.
  # Volontairement séparé de pytest pour feedback rapide et parallèle.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install poetry
        run: pipx install poetry

      - name: Install dependencies (dev only, pas de stockfish nécessaire)
        run: poetry install --no-interaction --only=main,dev

      - name: ruff check
        run: poetry run ruff check .

      - name: ruff format --check
        run: poetry run ruff format --check .

  # --- Job typecheck : mypy sur palamede_chessboard/ (code package, pas tests)
  # NB : ``strict = false`` dans pyproject.toml pour la Phase 0 — à durcir
  # progressivement en Phase 1/2 au fur et à mesure de l'extraction code.
  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: mypy
        # Scope = package code uniquement. Les tests restent sans types
        # stricts (fixtures/mocks produisent trop de bruit mypy).
        run: poetry run mypy palamede_chessboard

  # --- Job pytest : couverture tests + engine réel stockfish.
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Stockfish via apt — teste l'intégration python-chess ↔ UCI
      # réelle plutôt que de mocker partout. Détecte régressions UCI
      # silencieuses qu'un mock laisserait passer.
      # Repli seulement si apt échoue (11/11, #329) : le miroir Ubuntu
      # d'Azure ne se résolvait plus sur les runners, et archive.ubuntu.com
      # comme security.ubuntu.com, déjà dans apt-mirrors.txt, échouaient
      # aussi (exit 100, trois tentatives). On prend alors le binaire
      # officiel Stockfish 16, la version du paquet noble, vérifié par
      # sha256. Stockfish reste réellement installé et testé.
      - name: Install stockfish (engine)
        env:
          SF_URL: https://github.com/official-stockfish/Stockfish/releases/download/sf_16/stockfish-ubuntu-x86-64-modern.tar
          SF_SHA256: dc94bdfbc0097a7606d3ed13b855cb03ee99184301b6fc8f8d85c68c4726bf8a
        run: |
          if ! { sudo apt-get update && sudo apt-get install -y stockfish; }; then
            echo "::warning::apt n'a pas installé stockfish : repli sur le binaire officiel sf_16"
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/sf.tar" "$SF_URL"
            echo "$SF_SHA256  $RUNNER_TEMP/sf.tar" | sha256sum -c -
            tar -xf "$RUNNER_TEMP/sf.tar" -C "$RUNNER_TEMP"
            sudo install -m 755 "$RUNNER_TEMP/stockfish/stockfish-ubuntu-x86-64-modern" /usr/local/bin/stockfish
          fi
          command -v stockfish
          stockfish --help 2>&1 | head -3 || true

      - name: Install poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: pytest + coverage
        run: poetry run pytest -q --cov=palamede_chessboard --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

  # --- Job windows : the bridge's code that depends on the OS, run natively
  # (no simulated sys.platform) : token file check (#88), app (#78).
  # A list of files, not the whole suite : the server side is Linux only.
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: pytest (bridge)
        run: poetry run pytest -q -rs chessnut/tests/test_chessnut.py chessnut/tests/test_chessnut_app.py

  # --- Job size : the survey of 09/11 (owner's decisions of 10/11) as a
  # warning, never a block : continue-on-error, each threshold crossed as an
  # annotation on the file and in the run summary. Thresholds and measures
  # in scripts/size_report.py (C901 15, Python 400 LOC, JS template 300 LOC,
  # JS function 20 branches).
  size:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install poetry
        run: pipx install poetry

      - name: Install dependencies (dev only, ruff)
        run: poetry install --no-interaction --only=main,dev

      - name: size report
        run: poetry run python scripts/size_report.py
