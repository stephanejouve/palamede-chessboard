[tool.poetry]
name = "palamede-chessboard"
version = "0.21.0"
description = "Serveur MCP de parties d'échecs multi-agents (extrait de outillages)"
authors = ["Stéphane Jouve"]
license = "MIT"
readme = "README.md"
packages = [{include = "palamede_chessboard"}]

[tool.poetry.dependencies]
python = "^3.11"
chess = "^1.10.0"
mcp = "^1.26.0"
fastapi = "^0.115.0"
uvicorn = "^0.32.0"
pydantic = "^2.8.0"
jinja2 = "^3.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.0"
pytest-asyncio = "^1.0.0"
pytest-cov = "^6.0.0"
ruff = "^0.8.0"
mypy = "^1.13.0"
pre-commit = "^4.0.0"
httpx = "^0.28.0"
# Chessnut Air+ bridge, its own package (chessnut/) so that the board
# side installs without the server stack ; here for its tests and mypy.
palamede-chessnut = { path = "chessnut", develop = true }
# Maia bot (#93), its own package and image (maia/) : here for its tests
# and mypy only. GPL-3.0 ; nothing of it is imported by palamede_chessboard.
palamede-maia = { path = "maia", develop = true }

# [tool.poetry.scripts] — préfixe ``palamede-`` choisi pendant la
# cohabitation avec les modules chess d'``outillages`` (nit CD review #1) ;
# ces modules ont été supprimés depuis (outillages#456).
[tool.poetry.scripts]
palamede-lessons = "palamede_chessboard.cli_lessons:main"
palamede-players = "palamede_chessboard.cli_players:main"
palamede-elo = "palamede_chessboard.cli_elo:main"
palamede-matchmaking = "palamede_chessboard.cli_matchmaking:main"
palamede-chessboard-viewer = "palamede_chessboard.viewer.app:main"
palamede-chessboard-server = "palamede_chessboard.mcp_chessboard_server:main"
palamede-chess-arbiter-daemon = "palamede_chessboard.chess_arbiter_daemon:main"
palamede-coach = "palamede_chessboard.coach.diagnosis:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C", "B", "UP"]
ignore = ["E501", "B008", "C901"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# Optional extras of the bridge (bleak, pywebview, hidapi) : absent from the default install.
module = ["bleak", "bleak.*", "webview", "webview.*", "hid"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "chessnut/tests"]
