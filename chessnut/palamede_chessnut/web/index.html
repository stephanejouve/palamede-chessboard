<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="palamede-nonce" content="__PALAMEDE_NONCE__">
<title>Échiquier</title>
<link rel="stylesheet" href="/vendor/chessground.base.css">
<link rel="stylesheet" href="/vendor/chessground.brown.css">
<link rel="stylesheet" href="/vendor/chessground.cburnett.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header>
  <h1 id="game">Échiquier</h1>
  <ul id="lights">
    <li id="light-bluetooth" class="light waiting" title="Liaison Bluetooth avec l'échiquier">Bluetooth</li>
    <li id="light-server" class="light waiting" title="Flux de la partie depuis le serveur">Serveur</li>
    <li id="light-sync" class="light waiting" title="L'échiquier correspond à la partie">Synchronisation</li>
    <li id="light-token" class="light waiting" title="Le serveur reconnaît le jeton du joueur">Jeton</li>
  </ul>
</header>
<main>
  <div id="board-col">
    <div id="board"></div>
    <section id="tray" aria-label="Mise en place" hidden>
      <p id="differing"></p>
    </section>
  </div>
  <section id="side">
    <section id="picker" aria-labelledby="picker-title" hidden>
      <h2 id="picker-title">Ouvrir une partie</h2>
      <p id="picker-msg" role="status" hidden></p>
      <ul id="picker-list"></ul>
      <button type="button" id="picker-close">Fermer</button>
    </section>
    <div id="clocks" hidden>
      <p class="clock" id="clock-top"><span class="side"></span><span class="time"></span></p>
      <p class="clock" id="clock-bottom"><span class="side"></span><span class="time"></span></p>
    </div>
    <p id="status">En attente du pont…</p>
    <p id="token-msg" role="alert" hidden></p>
    <p id="relay" hidden></p>
    <p id="move-error" role="alert" hidden></p>
    <label id="promotion-row" hidden>Promotion en
      <select id="promotion">
        <option value="q">dame</option>
        <option value="r">tour</option>
        <option value="b">fou</option>
        <option value="n">cavalier</option>
      </select>
    </label>
    <ol id="moves"></ol>
    <div id="fen-row">
      <button type="button" id="open-btn" title="Une autre de vos parties en cours (menu Fichier ▸ Ouvrir)">Ouvrir…</button>
      <button type="button" id="flip-btn" aria-pressed="false" title="Voir l'échiquier depuis l'autre camp">Retourner</button>
      <button type="button" id="fen-btn">FEN</button>
      <button type="button" id="name-btn" title="Le nom de la partie, pour en demander l'analyse par exemple">Nom</button>
      <button type="button" id="pgn-btn" title="La partie entière, coups compris">PGN</button>
      <input id="fen" type="text" readonly spellcheck="false" aria-label="FEN de la position" hidden>
      <input id="game-name" class="copy-field" type="text" readonly spellcheck="false" aria-label="Nom de la partie" hidden>
      <textarea id="pgn" class="copy-field" readonly spellcheck="false" rows="8" aria-label="PGN de la partie" hidden></textarea>
      <button type="button" id="pgn-save" hidden>Enregistrer…</button>
      <p id="export-msg" role="status" hidden></p>
    </div>
    <button type="button" id="log-btn" aria-expanded="false">Journal</button>
    <pre id="log" hidden></pre>
  </section>
</main>
<script type="module" src="/app.js"></script>
</body>
</html>
