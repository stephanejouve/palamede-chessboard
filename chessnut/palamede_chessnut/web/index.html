<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Échiquier</title>
<link rel="stylesheet" href="/vendor/chessground.base.css">
<link rel="stylesheet" href="/vendor/chessground.brown.css">
<link rel="stylesheet" href="/vendor/chessground.cburnett.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header>
  <h1 id="game">Échiquier</h1>
  <ul id="lights">
    <li id="light-bluetooth" class="light waiting" title="Liaison Bluetooth avec l'échiquier">Bluetooth</li>
    <li id="light-server" class="light waiting" title="Flux de la partie depuis le serveur">Serveur</li>
    <li id="light-sync" class="light waiting" title="L'échiquier correspond à la partie">Synchronisation</li>
  </ul>
</header>
<main>
  <div id="board"></div>
  <section id="side">
    <p id="status">En attente du pont…</p>
    <p id="relay" hidden></p>
    <p id="differing" hidden></p>
    <ol id="moves"></ol>
    <div id="fen-row">
      <button type="button" id="fen-btn">FEN</button>
      <code id="fen" hidden></code>
    </div>
    <button type="button" id="log-btn" aria-expanded="false">Journal</button>
    <pre id="log" hidden></pre>
  </section>
</main>
<script type="module" src="/app.js"></script>
</body>
</html>
